# QVault backend tooling config (Phase 1 foundation).
# Packaging/build details are finalized in Phase 2.

[project]
name = "qvault-backend"
version = "0.1.0"
description = "QVault — YouTube Question Extraction platform (backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: ffmpeg-driven tests that encode/decode real synthetic video"]
